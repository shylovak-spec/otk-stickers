<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Критерії для стікерів СЄ + QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
<div>
    <header class="flex justify-between items-center mb-6 pt-2">
        <div>
            <span class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">Контроль Якості</span>
            <h1 class="text-xl font-bold text-gray-900">Критерії для стікерів СЄ + QR</h1>
        </div>
        <a href="index.html" class="text-xs bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg font-bold active:scale-95 transition inline-block">
            ⬅️ Назад
        </a>
    </header>
</div>

        <!-- STEP 1: ZONE SELECTOR -->
        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Крок 1. Оберіть зону на стікері</label>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-zone-graphic" onclick="selectZone('graphic')" class="zone-btn border-2 border-dashed border-gray-300 bg-white p-3 rounded-xl text-center transition-all active:scale-95 flex flex-col items-center justify-center">
                    <div class="font-bold text-xs leading-tight">Зона графічних позначень</div>
                </button>
                <button id="btn-zone-text" onclick="selectZone('text')" class="zone-btn border-2 border-dashed border-gray-300 bg-white p-3 rounded-xl text-center transition-all active:scale-95 flex flex-col items-center justify-center">
                    <div class="font-bold text-xs leading-tight">Зона тексту</div>
                </button>
                <button id="btn-zone-qr" onclick="selectZone('qr')" class="zone-btn border-2 border-dashed border-gray-300 bg-white p-3 rounded-xl text-center transition-all active:scale-95 flex flex-col items-center justify-center">
                    <div class="font-bold text-xs leading-tight">Зона коду QR</div>
                </button>
                <button id="btn-zone-white" onclick="selectZone('white')" class="zone-btn border-2 border-dashed border-gray-300 bg-white p-3 rounded-xl text-center transition-all active:scale-95 flex flex-col items-center justify-center">
                    <div class="font-bold text-xs leading-tight">"Біла" зона</div>
                </button>
            </div>
        </div>

        <!-- STEP 2: DEFECT SELECTOR -->
        <div id="step-defects" class="mb-6 opacity-40 pointer-events-none transition-all duration-300">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Крок 2. Який дефект виявили?</label>
            <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                <button onclick="checkDefect(1)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">1. Сторонні включення (ворс, в т.ч. і кольоровий)</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(2)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">2. Сторонні включення (вкраплення, плями)</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(3)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">3. Сторонні включення (кольорові: червоні, сині тощо)</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(4)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">4. Повна або часткова відсутність ламінації</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(5)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">5. Розшарування / пошкодження / здуття ламінації</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(6)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">6. Сліди від поліграфічних валиків</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(7)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">7. Задвоєння друкованих елементів</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(8)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">8. Нечіткий друк</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(9)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">9. Зміщення друку</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(10)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">10. Відсутність порізки</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(11)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">11. Граматичні помилки в тексті</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(12)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">12. Кольорові плями / Сліди фарби</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(13)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">13. Механічне пошкодження / Деформація</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(14)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">14. Порушена геометрія порізки (вирубки)</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(15)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">15. Розпливчастий або розмазаний друк</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(16)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">16. Відмаркування (перебивання фарби)</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(17)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">17. Залишки фарби</span>
                    <span class="text-gray-400">❯</span>
                </button>
                <button onclick="checkDefect(18)" class="defect-btn w-full bg-white p-3 rounded-xl text-left border border-gray-200 flex items-center justify-between shadow-sm active:bg-gray-50">
                    <span class="text-sm font-medium text-gray-800">18. Сірий відтінок матеріалу</span>
                    <span class="text-gray-400">❯</span>
                </button>
            </div>
        </div>

        <!-- STEP 3: VERDICT CARD -->
        <div id="result-card" class="hidden transform transition-all duration-300 my-4"></div>
    </div>

    <!-- FOOTER -->
    <div class="text-center py-4 border-t border-gray-200 mt-6">
        <p class="text-[11px] text-gray-400">Стандарт якості ОТК v1.0 • Мобільний термінал</p>
    </div>

    <script>
        let selectedZone = null;

        const notAllowedObj = { status: 'bad', title: 'НЕ ДОПУСКАЄТЬСЯ', desc: 'Дефект у даній зоні є критичним та не допускається.' };

        const db = {
            1: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '• 1 шт. ≤ 2 мм.\n• 2 шт. ≤ 1 мм.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускається будь-якого розміру при умові:\n• Не заважає читанню тексту\n• Ворс не переходить до іншої зони' },
                qr: notAllowedObj,
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '• 1 шт. ≤ 3 мм.\n• 2 шт. ≤ 2 мм.\n• 3 шт. ≤ 1 мм.' }
            },
            2: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '• До 3 шт. ≤ 0,4 мм.\n• До 5 шт. ≤ 0,3 мм.\n• До 6 шт. ≤ 0,2 мм.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: '• До 2 шт. ≤ 0,4 мм.\n• До 5 шт. ≤ 0,3 мм.\n• До 6 шт. ≤ 0,2 мм.\nПри умові, що не заважають читанню тексту.' },
                qr: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускається, якщо не заважає зчитуванню QR-коду.' },
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '• Безліч, якщо розмір ≤ 0,15 мм.\n• До 4 шт. ≤ 0,4 мм.\n• До 5 шт. ≤ 0,3 мм.\n• До 6 шт. ≤ 0,2 мм.' }
            },
            3: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '1 шт. ≤ 0,4 мм.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '1 шт. ≤ 0,4 мм.' },
                qr: notAllowedObj,
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '• 1 шт. ≤ 0,4 мм.\n• 2 шт. ≤ 0,3 мм.\n• 4 шт. ≤ 0,2 мм.\n• 6 шт. ≤ 0,1 мм.' }
            },
            4: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            5: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            6: {
                graphic: notAllowedObj,
                text: notAllowedObj,
                qr: notAllowedObj,
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускається, якщо не переходить в іншу зону.' }
            },
            7: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            8: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            9: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            10: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            11: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            12: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            13: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            14: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Допускається ≤ 1 мм в будь-якому напрямку.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Допускається ≤ 1 мм в будь-якому напрямку.' },
                qr: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Допускається ≤ 1 мм в будь-якому напрямку.' },
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Допускається ≤ 1 мм в будь-якому напрямку.' }
            },
            15: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '≤ 0,2 мм.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '≤ 0,2 мм.' },
                qr: notAllowedObj,
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: '≤ 0,2 мм.' }
            },
            16: { graphic: notAllowedObj, text: notAllowedObj, qr: notAllowedObj, white: notAllowedObj },
            17: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускаються залишки фарби ≤ 1 мм при умові:\n• Залишки фарби не знаходяться на зоні QR-коду\n• Залишки фарби не заважають читанню тексту' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускаються залишки фарби ≤ 1 мм при умові:\n• Залишки фарби не знаходяться на зоні QR-коду\n• Залишки фарби не заважають читанню тексту' },
                qr: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускаються залишки фарби ≤ 1 мм при умові:\n• Залишки фарби не знаходяться на зоні QR-коду\n• Залишки фарби не заважають читанню тексту' },
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ З УМОВОЮ', desc: 'Допускаються залишки фарби ≤ 1 мм при умові:\n• Залишки фарби не знаходяться на зоні QR-коду\n• Залишки фарби не заважають читанню тексту' }
            },
            18: {
                graphic: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Сірий відтінок матеріалу допускається.' },
                text: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Сірий відтінок матеріалу допускається.' },
                qr: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Сірий відтінок матеріалу допускається.' },
                white: { status: 'good', title: 'ДОПУСКАЄТЬСЯ', desc: 'Сірий відтінок матеріалу допускається.' }
            }
        };

        function selectZone(zone) {
            selectedZone = zone;
            
            document.querySelectorAll('.zone-btn').forEach(b => {
                b.classList.remove('border-black', 'bg-gray-900', 'text-white');
                b.classList.add('border-gray-300', 'bg-white', 'text-gray-800');
            });

            const activeBtn = document.getElementById(`btn-zone-${zone}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-gray-300', 'bg-white', 'text-gray-800');
                activeBtn.classList.add('border-black', 'bg-gray-900', 'text-white');
            }

            const step2 = document.getElementById('step-defects');
            step2.classList.remove('opacity-40', 'pointer-events-none');

            document.getElementById('result-card').classList.add('hidden');
        }

        function checkDefect(id) {
            if (!selectedZone) return;

            const res = db[id]?.[selectedZone];
            const card = document.getElementById('result-card');

            if (!res) {
                card.innerHTML = `
                    <div class="bg-gray-700 text-white p-5 rounded-2xl shadow-lg">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-2xl">ℹ️</span>
                            <h2 class="font-bold text-md uppercase">Інформація відсутня</h2>
                        </div>
                        <p class="text-xs opacity-80">Опис цього дефекту для даної зони відсутній у базі.</p>
                    </div>
                `;
                card.classList.remove('hidden');
                return;
            }

            const isBad = res.status === 'bad';
            const bgColor = isBad ? 'bg-red-500' : 'bg-emerald-600';
            const icon = isBad ? '⛔' : '✅';

            card.innerHTML = `
                <div class="${bgColor} text-white p-4 rounded-2xl shadow-lg">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-2xl">${icon}</span>
                        <h2 class="font-extrabold text-lg tracking-wide uppercase">${res.title}</h2>
                    </div>
                    <p class="text-sm font-medium opacity-95 whitespace-pre-line leading-relaxed border-t border-white/20 pt-0.5 mt-0.5">${res.desc}</p>
                </div>
            `;
            card.classList.remove('hidden');
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetAll() {
            selectedZone = null;
            document.querySelectorAll('.zone-btn').forEach(b => {
                b.classList.remove('border-black', 'bg-gray-900', 'text-white');
                b.classList.add('border-gray-300', 'bg-white', 'text-gray-800');
            });
            document.getElementById('step-defects').classList.add('opacity-40', 'pointer-events-none');
            document.getElementById('result-card').classList.add('hidden');
        }
    </script>
</body>
</html>
